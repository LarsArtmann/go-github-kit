name: Benchmark trend

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  benchstat:
    name: Compare benchmarks against baseline
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: go test -run '^$' -bench . -count 6 . > current.txt

      - name: Compare against baseline
        run: |
          {
            echo "## Benchmark comparison"
            echo
            echo '```'
            go tool benchstat docs/benchmarks/baseline-benchmarks.txt current.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload current results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: current.txt
          retention-days: 30
