name: Nightly fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParseRateLimitHeaders]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ${{ matrix.target }} for 90s
        id: fuzz
        continue-on-error: true
        env:
          GOEXPERIMENT: jsonv2
        run: |
          set +e
          go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 90s . 2>&1 | tee fuzz.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload crashers and log
        if: steps.fuzz.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.target }}-crashers
          path: |
            fuzz.log
            testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the job on a crasher
        if: steps.fuzz.outcome != 'success'
        run: exit 1
