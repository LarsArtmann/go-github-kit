name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version whose CHANGELOG section to extract (e.g. 0.1.0); empty = ref name"
        default: ""
      dry_run:
        description: "Dry run: extract and upload the notes, skip publishing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release from CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from CHANGELOG
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT:-${GITHUB_REF_NAME#v}}"
          awk -v header="## [${version}]" '
            index($0, header) == 1 { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for ${version}; falling back." >&2
            echo "See [CHANGELOG.md](./CHANGELOG.md) for changes in ${version}." > release-notes.md
          fi

      - name: Upload extracted notes (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-dry-run
          path: release-notes.md
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
