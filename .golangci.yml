version: "2"
run:
  timeout: 5m
  go: 1.26.5
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - noinlineerr
  settings:
    cyclop:
      max-complexity: 12
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - $module
            - github.com/LarsArtmann/go-github-kit # root-package self-imports in tests
            - github.com/google/go-github/v69
            - github.com/onsi/ginkgo/v2
            - github.com/onsi/gomega
    exhaustruct:
      exclude:
        - os/exec.Cmd
        # Partial literals are the API design here: zero-value snapshots
        # mean "no information", options merge field-by-field, and transport
        # structs are tuned, not exhausted.
        - github.com/LarsArtmann/go-github-kit\.(RateLimitSnapshot|ETagStats|ETagCache|ETagOptions|Options|StatusError|RateLimitOptions|RetryOptions|RateLimitCache|rateProber|gateTransport|feedTransport|retryTransport|etagTransport)
        - net/http\.(Transport|Client|Response)
    goconst:
      min-occurrences: 4
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: true
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
        - db
        - id
        - mu
        - wg
        - w
        - r
        - n
        - o
        - req
        - res
        - ctx
        - url
      ignore-type-assert-ok: true
  exclusions:
    generated: lax
    rules:
      # The transport stack's contract is to return RoundTripper errors
      # verbatim (that is what an http.RoundTripper does); wrapcheck's
      # "wrap everything" rule contradicts the design.
      - path: ^(transport|etag|probe)\.go$
        linters: [wrapcheck]
      # Test HTTP handlers construct raw response structs by hand; fixture
      # servers, fake clocks, and table-driven cases make strictness linters
      # noise here without catching anything real.
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
          - gosec # test servers accept any token by design
          - err113
          - wrapcheck
          - nlreturn
          - wsl_v5
          - canonicalheader # both GitHub header spellings are deliberately exercised
          - varnamelen
          - unparam
      # The Ginkgo bootstrap is parallelized by RunSpecs, not t.Parallel.
      - path: ^githubkit_suite_test\.go$
        linters:
          - paralleltest
    paths:
      - _templ\.go$
      - \.gen\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
