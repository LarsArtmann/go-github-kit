name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version whose CHANGELOG section to extract (e.g. 0.1.0); empty = ref name"
        default: ""
      dry_run:
        description: "Dry run: extract and upload the notes, skip publishing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release from CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract release notes from CHANGELOG
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT:-${GITHUB_REF_NAME#v}}"
          awk -v header="## [${version}]" '
            index($0, header) == 1 { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for ${version}; falling back." >&2
            echo "See [CHANGELOG.md](./CHANGELOG.md) for changes in ${version}." > release-notes.md
          fi

      - name: Upload extracted notes (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes-dry-run
          path: release-notes.md
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
