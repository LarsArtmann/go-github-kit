name: Nightly fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParseRateLimitHeaders]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Keep the discovered corpus between runs: without this, every night
      # starts from the in-repo seeds and re-explores the same shapes.
      - name: Restore fuzz corpus
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }} for 90s
        id: fuzz
        continue-on-error: true
        run: |
          set +e
          go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 90s . 2>&1 | tee fuzz.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload crashers and log
        if: steps.fuzz.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-crashers
          path: |
            fuzz.log
            testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the job on a crasher
        if: steps.fuzz.outcome != 'success'
        run: exit 1
