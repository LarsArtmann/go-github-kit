name: Update flake lock

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock:
    name: Bump flake.lock (opens a PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update flake.lock
        run: nix flake update

      - name: Verify the update still builds
        continue-on-error: true
        run: nix build .#default

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore(deps): update flake.lock"
          body: |
            Automated monthly nixpkgs refresh.

            CI on this PR runs `nix flake check`; a vendorHash mismatch here
            means the nixpkgs bump rehashed the vendor derivation — re-derive
            per CONTRIBUTING.md and push to this branch.
          branch: deps/flake-lock-update
          commit-message: "chore(deps): update flake.lock"
          delete-branch: true
